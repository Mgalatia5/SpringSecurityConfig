# Production: run with SPRING_PROFILES_ACTIVE=prod.
# Secrets have no defaults here, so the app refuses to start if one is missing.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Never let Hibernate alter a production schema. Set DDL_AUTO=update only for the very first deploy.
      ddl-auto: ${DDL_AUTO:validate}

app:
  jwt:
    secret: ${JWT_SECRET}
  admin:
    password: ${ADMIN_PASSWORD}
