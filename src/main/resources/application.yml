server:
  port: 9095
spring:
  application:
    name: user_service
  datasource:
    url: jdbc:mysql://localhost:3305/springsecurity?useSSL=false
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
